family: imaging
display_name: Aspose.Imaging for .NET
enabled: true
status: discovery_only
# TC-IMPL-008: Updated 2026-06-04 for non-LowCode fallback sprint.
# No LowCode namespace. Using fallback_strategy=capability_registry.
# Image.Save confirmed via DllReflector (Aspose.Imaging 26.6.0 / net8.0).
# Probe verdict: PROBE_CONFIRMED — TIER-1 PNG fixture (69 bytes, programmatic)
# See reports/lowcode-non-lowcode-fallback-implementation-20260604/prototypes/imaging/

nuget:
  package_id: Aspose.Imaging
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Imaging.LowCode
    - Aspose.Imaging.LowCode.*
  fallback_strategy: capability_registry

github:
  official_examples_repo:
    owner: aspose-imaging
    repo: Aspose.Imaging-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-imaging-net
    repo: Aspose.Imaging.Plugins-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
