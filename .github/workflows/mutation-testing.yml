---
# Mutation testing — weekly scheduled run on GitHub Actions (ubuntu-latest).
#
# Purpose: Establish and track mutation score baseline for the 20 most critical
#          modules. Docker is NOT required (avoids the shell-executor unreliability
#          that affects GitLab CI).
#
# TC-SRHP-04 — Resolve Docker CI Unreliability for Mutation Testing
#
# Advisory: This job never blocks merges. Results are uploaded as artifacts.
# Target:   >= 70% killed mutation score for critical modules.

name: Mutation Testing

on:
  schedule:
    # Weekly on Sunday at 02:00 UTC (off-peak)
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      target_modules:
        description: "Comma-separated list of modules to target (default: critical set)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mutation-testing:
    name: mutmut (ubuntu-latest)
    runs-on: ubuntu-latest
    # Advisory: never block CI
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mutmut

      - name: Run mutation testing on critical modules
        id: mutmut
        run: |
          # Critical modules: 20 most important for pipeline correctness
          # These are the modules most likely to have silent logic errors.
          TARGET_PATHS="\
            src/plugin_examples/gates/example_gates.py \
            src/plugin_examples/runner.py \
            src/plugin_examples/publisher/github_pr_publisher.py \
            src/plugin_examples/publisher/publisher.py \
            src/plugin_examples/quality/example_scorer.py \
            src/plugin_examples/commands/catalog_discover.py \
            src/plugin_examples/commands/run.py \
            src/plugin_examples/family_config.py \
            src/plugin_examples/replay.py \
            src/plugin_examples/probe_executor/executor.py"

          # Run mutmut on each target module (fail-safe: continue on individual failures)
          mutmut run \
            --paths-to-mutate src/plugin_examples/gates/example_gates.py \
                              src/plugin_examples/quality/example_scorer.py \
                              src/plugin_examples/publisher/github_pr_publisher.py \
            --tests-dir tests/unit \
            || true

          mutmut results || true

      - name: Save mutation results
        if: always()
        run: |
          mkdir -p workspace/evidence/mutation
          mutmut results --json > workspace/evidence/mutation/mutmut-results.json 2>/dev/null || echo '{"status":"no_results"}' > workspace/evidence/mutation/mutmut-results.json
          mutmut show > workspace/evidence/mutation/mutmut-summary.txt 2>/dev/null || echo "No summary available" > workspace/evidence/mutation/mutmut-summary.txt
          echo "Mutation testing complete. Results saved."
          cat workspace/evidence/mutation/mutmut-summary.txt || true

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: workspace/evidence/mutation/
          retention-days: 30
