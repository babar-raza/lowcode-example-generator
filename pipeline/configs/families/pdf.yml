family: pdf
display_name: Aspose.PDF for .NET
enabled: true
status: active

nuget:
  package_id: Aspose.PDF
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
    - net48
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Pdf.LowCode
    - Aspose.Pdf.LowCode.*

github:
  official_examples_repo:
    owner: aspose-pdf
    repo: Aspose.PDF-for-.NET
    branch: master

  published_plugin_examples_repo:
    owner: aspose-pdf-net
    repo: Aspose.PDF.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources:
    - type: github
      owner: aspose-pdf
      repo: Aspose.PDF-for-.NET
      branch: master
      paths:
        - Examples/Data

existing_examples:
  sources:
    - type: github
      owner: aspose-pdf
      repo: Aspose.PDF-for-.NET
      branch: master
      paths:
        - Examples/CSharp

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 15
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types:
    - Merger
    - TextExtractor
    - Splitter
    - Optimizer
    - PdfAConverter
    - DocConverter
    - XlsConverter
    - Html
    - Jpeg
    - Png
    - Tiff
    - TocGenerator
    - ImageExtractor
    - TableGenerator
    - Security
    - FormFlattener
    - FormEditor
    - FormExporter
    - Signature
  preferred_methods_per_type:
    Merger: Process
    Splitter: Process
    Optimizer: Process
    TextExtractor: Process
    PdfAConverter: Process
    DocConverter: Process
    XlsConverter: Process
    Html: Process
    Jpeg: Process
    Png: Process
    Tiff: Process
    TocGenerator: Process
    ImageExtractor: Process
    TableGenerator: Process
    Security: Process
    FormFlattener: Process
    FormEditor: Process
    FormExporter: Process
    Signature: Process

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: true
  require_example_reviewer: true
  runtime_runner: auto

llm:
  provider_order:
    - llm_professionalize
    - ollama

template_hints:
  default_input_extension: ".pdf"
  default_input_filename: "input.pdf"
  array_input_filenames: ["input1.pdf", "input2.pdf"]
  input_creation_lines:
    - 'var doc = new Aspose.Pdf.Document();'
    - 'doc.Pages.Add();'
    - 'doc.Save("input.pdf");'
  merger_input_creation_lines:
    - 'var doc1 = new Aspose.Pdf.Document();'
    - 'doc1.Pages.Add();'
    - 'doc1.Save("input1.pdf");'
    - 'var doc2 = new Aspose.Pdf.Document();'
    - 'doc2.Pages.Add();'
    - 'doc2.Save("input2.pdf");'
  text_extractor_input_creation_lines:
    - 'var doc = new Aspose.Pdf.Document();'
    - 'var page = doc.Pages.Add();'
    - 'page.Paragraphs.Add(new Aspose.Pdf.Text.TextFragment("Hello LowCode PDF"));'
    - 'doc.Save("input.pdf");'
  additional_usings:
    - "Aspose.Pdf"
    - "Aspose.Pdf.LowCode"
  text_extractor_additional_usings:
    - "Aspose.Pdf"
    - "Aspose.Pdf.LowCode"
    - "Aspose.Pdf.Text"
  # Corrected API patterns (validated via C# harness, Phase 3):
  output_creation_pattern: 'options.AddOutput(new FileDataSource("output.pdf"))  // FileDataSource, NOT FileSaveTarget'
  result_check_pattern: 'result.ResultCollection.Count > 0  // no IsSuccess property'
  text_extractor_result_pattern: '((StringResult)result.ResultCollection[0]).Text  // NOT .OperationResult[0].Data'
  output_naming_note: 'Do not use format strings in Splitter output filename (e.g. output_{0}.pdf) — use plain output.pdf'
  default_output_extension: ".pdf"
  default_fixture_extension: ".pdf"
  # Wave B: DocConverter fixture (programmatic PDF input, DOCX output)
  doc_converter_input_creation_lines:
    - 'var doc = new Aspose.Pdf.Document();'
    - 'var page = doc.Pages.Add();'
    - 'page.Paragraphs.Add(new Aspose.Pdf.Text.TextFragment("LowCode DocConverter Test"));'
    - 'doc.Save("input.pdf");'
  doc_converter_output_extension: ".docx"
  # Wave B: XlsConverter fixture (programmatic PDF with table-like content, XLSX output)
  xls_converter_input_creation_lines:
    - 'var doc = new Aspose.Pdf.Document();'
    - 'var page = doc.Pages.Add();'
    - 'page.Paragraphs.Add(new Aspose.Pdf.Text.TextFragment("Name    Score"));'
    - 'doc.Save("input.pdf");'
  xls_converter_output_extension: ".xlsx"
  # Wave B: Html converter fixture (HTML string input, PDF output)
  # IMPORTANT: Html plugin converts HTML to PDF. Input must be an HTML file (NOT a PDF).
  html_input_creation_lines:
    - 'System.IO.File.WriteAllText("input.html", "<html><body><h1>Hello LowCode</h1><p>HTML to PDF conversion via Aspose.PDF LowCode.</p></body></html>");'
  html_input_extension: ".html"
  html_output_extension: ".pdf"
  html_options_note: 'HtmlToPdfOptions: use AddInput(new FileDataSource("input.html")) and AddOutput(new FileDataSource("output.pdf")). Input MUST be an HTML file, not a PDF.'
  # Wave C: Image output types (Jpeg, Png, Tiff)
  # All three use the same programmatic PDF input as other converters.
  # Output extension differs per type. Options class matches type name + Options.
  jpeg_output_extension: ".jpg"
  png_output_extension: ".png"
  tiff_output_extension: ".tiff"
  image_converter_note: 'For Jpeg/Png/Tiff: new JpegOptions()/PngOptions()/TiffOptions(), AddInput(FileDataSource(input.pdf)), AddOutput(FileDataSource(output.jpg/png/tiff)), new Jpeg()/Png()/Tiff().Process(options)'

per_type_constraints:
  Merger:
    required:
      - "REQUIRED: new MergeOptions( — use MergeOptions as the concrete options class for Merger"
      - "REQUIRED: new Merger().Process(options) — use the LowCode Merger plugin, not PdfFileEditor"
      - "REQUIRED: options.AddInput(new FileDataSource( — each input PDF must be added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — output must be added via AddOutput(new FileDataSource(path))"
    forbidden:
      - "FORBIDDEN: PdfFileEditor — this is the core Aspose.Pdf.Facades API; use Aspose.Pdf.LowCode.Merger instead"
  TextExtractor:
    required:
      - "REQUIRED: new TextExtractor().Process(options) — use the LowCode TextExtractor plugin"
    forbidden: []
  Splitter:
    required:
      - "REQUIRED: new Splitter().Process(options) — use the LowCode Splitter plugin, not PdfFileEditor"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
    forbidden:
      - "FORBIDDEN: PdfFileEditor — use Aspose.Pdf.LowCode.Splitter instead"
  Optimizer:
    required:
      - "REQUIRED: new Optimizer().Process(options) — use the LowCode Optimizer plugin"
    forbidden: []
  PdfAConverter:
    required:
      - "REQUIRED: new PdfAConverter().Process(options) — use the LowCode PdfAConverter plugin"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for PdfAConverter and FileDataSource)"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: new PdfAConvertOptions( — use PdfAConvertOptions as the concrete options class (NOT PluginOptions)"
      - "REQUIRED: options.AddInput(new FileDataSource( — input must be added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — output must be added via AddOutput(new FileDataSource(path))"
      - "REQUIRED: new Document( — programmatic PDF input via new Document() + doc.Pages.Add() + doc.Save()"
      - "REQUIRED: using Aspose.Pdf.Text; (for TextFragment in fixture creation)"
    forbidden:
      - "FORBIDDEN: PdfFormatConversionOptions — use LowCode PdfAConverter with its own options class"
      - "FORBIDDEN: Document.Convert() — use LowCode PdfAConverter.Process() instead"
      - "FORBIDDEN: PdfSaveOptions with PDF/A standard — use LowCode PdfAConverter"
      - "FORBIDDEN: FileSaveTarget as AddOutput argument — use FileDataSource(path) instead"
      - "FORBIDDEN: LowCodeLoadOptions — use PdfAConvertOptions instead"
      - "FORBIDDEN: LowCodeSaveOptions — use PdfAConvertOptions instead"
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use PdfAConvertOptions"
  DocConverter:
    template_first: true
    required:
      - "REQUIRED: new PdfToDocOptions( — use PdfToDocOptions as the concrete options class (NOT PdfConverterOptions which is abstract)"
      - "REQUIRED: new DocConverter().Process(options) — use the LowCode DocConverter plugin"
      - "REQUIRED: options.SaveFormat = Aspose.Pdf.LowCode.SaveFormat.DocX — use fully-qualified SaveFormat.DocX to avoid CS0104 ambiguity with Aspose.Pdf.SaveFormat"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — output added via AddOutput(new FileDataSource(path))"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for DocConverter, PdfToDocOptions, FileDataSource, SaveFormat)"
      - "REQUIRED: using Aspose.Pdf.Text; (for TextFragment fixture creation)"
    forbidden:
      - "FORBIDDEN: new PdfConverterOptions() — PdfConverterOptions is abstract; use PdfToDocOptions instead"
      - "FORBIDDEN: Document.Save(SaveFormat.DocX) — this is core API; use LowCode DocConverter.Process() instead"
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract"
  XlsConverter:
    template_first: true
    required:
      - "REQUIRED: new PdfToXlsOptions( — use PdfToXlsOptions as the concrete options class"
      - "REQUIRED: new XlsConverter().Process(options) — use the LowCode XlsConverter plugin"
      - "REQUIRED: options.Format = PdfToXlsOptions.ExcelFormat.XLSX — set Format to XLSX for OOXML output (harness-verified magic 50-4B-03-04)"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — XLSX output added via AddOutput(new FileDataSource(path))"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for XlsConverter, PdfToXlsOptions, FileDataSource)"
    forbidden:
      - "FORBIDDEN: new PdfConverterOptions() — PdfConverterOptions is abstract; use PdfToXlsOptions instead"
      - "FORBIDDEN: ExcelFormat.XLS without namespace prefix — use PdfToXlsOptions.ExcelFormat.XLSX (nested enum)"
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract"
      - "FORBIDDEN: Aspose.Cells — use LowCode XlsConverter only; do not import Aspose.Cells for conversion"
  Html:
    template_first: true
    required:
      - "REQUIRED: new HtmlToPdfOptions( — use HtmlToPdfOptions as the concrete options class"
      - "REQUIRED: new Html().Process(options) — use the LowCode Html plugin to convert HTML to PDF"
      - "REQUIRED: AddInput(new FileDataSource(\"input.html\") — input MUST be an HTML file (var name may differ; .AddInput must receive FileDataSource with input.html)"
      - "REQUIRED: AddOutput(new FileDataSource(\"output.pdf\") — PDF output via AddOutput(new FileDataSource(\"output.pdf\"))"
      - "REQUIRED: File.WriteAllText(\"input.html\", — create the HTML input file programmatically before calling Process (use File.WriteAllText or System.IO.File.WriteAllText)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for Html, HtmlToPdfOptions, FileDataSource)"
      - "REQUIRED: <html> — the File.WriteAllText input string must contain the html root element"
    forbidden:
      - "FORBIDDEN: new PdfConverterOptions() — PdfConverterOptions is abstract; use HtmlToPdfOptions"
      - "FORBIDDEN: HtmlLoadOptions — this is core Aspose.Pdf API; use LowCode HtmlToPdfOptions instead"
      - "FORBIDDEN: Document(htmlFile) — this is core Aspose.Pdf constructor; use LowCode Html.Process() instead"
      - "FORBIDDEN: input.pdf as input to Html plugin — Html plugin takes HTML file input, NOT PDF input"
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract"
  Jpeg:
    template_first: true
    required:
      - "REQUIRED: new JpegOptions( — use JpegOptions as the concrete options class (NOT PluginOptions which is abstract)"
      - "REQUIRED: new Jpeg().Process(options) — use the LowCode Jpeg plugin to convert PDF to JPEG image"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — JPEG output added via AddOutput(new FileDataSource(\"output.jpg\"))"
      - "REQUIRED: \"output.jpg\" — JPEG output filename MUST be output.jpg (not output.pdf, not output.jpeg). The Jpeg plugin writes a .jpg file, never a .pdf."
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for Jpeg, JpegOptions, FileDataSource)"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use JpegOptions instead"
      - "FORBIDDEN: ImageDevice or PdfConverter — use LowCode Jpeg plugin instead"
      - "FORBIDDEN: .OutputDataSources — IOperationResult has no OutputDataSources property; validate by checking File.Exists(outputPath)"
      - "FORBIDDEN: result.ResultCollection[0].Path — IOperationResult has no Path property; use the output path you provided to AddOutput()"
  Png:
    template_first: true
    required:
      - "REQUIRED: new PngOptions( — use PngOptions as the concrete options class (NOT PluginOptions which is abstract)"
      - "REQUIRED: new Png().Process(options) — use the LowCode Png plugin to convert PDF to PNG image"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — PNG output added via AddOutput(new FileDataSource(\"output.png\"))"
      - "REQUIRED: result.ResultCollection.Count > 0 — validate using result.ResultCollection.Count, NOT File.Exists. The Png plugin creates page-numbered files (e.g. output_0.png); File.Exists(\"output.png\") always returns false."
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for Png, PngOptions, FileDataSource)"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use PngOptions instead"
      - "FORBIDDEN: ImageDevice or PdfConverter — use LowCode Png plugin instead"
      - "FORBIDDEN: File.Exists(\"output.png\") — the Png plugin creates page-numbered output files (output_0.png etc); File.Exists will always return false. Use result.ResultCollection.Count > 0 instead."
      - "FORBIDDEN: .OutputDataSources — IOperationResult has no OutputDataSources property"
      - "FORBIDDEN: result.ResultCollection[0].Path — IOperationResult has no Path property; use the output path you provided to AddOutput()"
  Tiff:
    template_first: true
    required:
      - "REQUIRED: new TiffOptions( — use TiffOptions as the concrete options class (NOT PluginOptions which is abstract)"
      - "REQUIRED: new Tiff().Process(options) — use the LowCode Tiff plugin to convert PDF to TIFF image"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — TIFF output added via AddOutput(new FileDataSource(\"output.tiff\"))"
      - "REQUIRED: \"output.tiff\" — TIFF output filename MUST be output.tiff (four letters, not output.tif). The Tiff plugin writes a .tiff file."
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for Tiff, TiffOptions, FileDataSource)"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use TiffOptions instead"
      - "FORBIDDEN: TiffDevice or PdfConverter — use LowCode Tiff plugin instead"
      - "FORBIDDEN: .OutputDataSources — IOperationResult has no OutputDataSources property; validate by checking File.Exists(outputPath)"
      - "FORBIDDEN: result.ResultCollection[0].Path — IOperationResult has no Path property; use the output path you provided to AddOutput()"
  TocGenerator:
    template_first: true
    required:
      - "REQUIRED: new TocOptions( — use TocOptions as the concrete options class for TocGenerator"
      - "REQUIRED: new TocGenerator().Process(options) — use the LowCode TocGenerator plugin to add table of contents to a PDF"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(\"input.pdf\"))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — output PDF with TOC added via AddOutput(new FileDataSource(\"output.pdf\"))"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for TocGenerator, TocOptions, FileDataSource)"
      - "REQUIRED: result.ResultCollection.Count > 0 — validate that TocGenerator produced output"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use TocOptions instead"
      - "FORBIDDEN: Document.Save() without TocGenerator — use LowCode TocGenerator.Process() instead"
      - "FORBIDDEN: TocOptions.Create() without TocGenerator.Process() — must call Process to apply"
      - "FORBIDDEN: PdfToImage — abstract class, not directly instantiable; use Jpeg/Png/Tiff instead"
  ImageExtractor:
    template_first: true
    required:
      - "REQUIRED: new ImageExtractorOptions( — use ImageExtractorOptions as the concrete options class"
      - "REQUIRED: new ImageExtractor().Process(options) — use the LowCode ImageExtractor plugin to extract images from PDF"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(\"input.pdf\"))"
      - "REQUIRED: result.ResultCollection.Count > 0 — validate that ImageExtractor produced results (no file output path needed; results in ResultCollection)"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for ImageExtractor, ImageExtractorOptions, FileDataSource)"
      - "REQUIRED: page.Resources.Images.Add( — embed at least one image in the fixture PDF so ImageExtractor has images to extract"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use ImageExtractorOptions instead"
      - "FORBIDDEN: PdfExtractor (Aspose.Pdf.Facades) — use LowCode ImageExtractor instead"
      - "FORBIDDEN: File.Exists(outputPath) — ImageExtractor stores extracted images in ResultCollection, not a file path"
      - "FORBIDDEN: options.AddOutput — ImageExtractor is an extractor (like TextExtractor); output is in ResultCollection, no AddOutput needed"
      - "FORBIDDEN: PdfToImage — abstract class, not directly instantiable"
  TableGenerator:
    template_first: true
    required:
      - "REQUIRED: TableOptions.Create() — use the static factory method to create options (NOT new TableOptions())"
      - "REQUIRED: new TableGenerator().Process(options) — use the LowCode TableGenerator plugin"
      - "REQUIRED: .AddTable() — call AddTable() on TableOptions to get a TableBuilder"
      - "REQUIRED: .AddRow() — call AddRow() on TableBuilder to get a TableRowBuilder"
      - "REQUIRED: .AddCell() — call AddCell() on TableRowBuilder to get a TableCellBuilder"
      - "REQUIRED: options.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: options.AddOutput(new FileDataSource( — PDF output added via AddOutput(new FileDataSource(path))"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.LowCode; (for TableGenerator, TableOptions, FileDataSource)"
      - "REQUIRED: using Aspose.Pdf.Text; (for TextFragment paragraph content)"
      - "REQUIRED: result.ResultCollection.Count > 0 — validate that TableGenerator produced output"
    forbidden:
      - "FORBIDDEN: new TableOptions() without .Create() — use TableOptions.Create() factory method"
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use TableOptions.Create()"
      - "FORBIDDEN: Document.Pages[1].Paragraphs.Add() — use LowCode TableGenerator, not manual table insertion"
      - "FORBIDDEN: Aspose.Pdf.Table — use the LowCode fluent builder (TableOptions/TableBuilder/TableRowBuilder/TableCellBuilder)"
    mandatory_reference_example: |
      using System;
      using Aspose.Pdf;
      using Aspose.Pdf.LowCode;
      using Aspose.Pdf.Text;

      var document = new Document();
      document.Pages.Add();
      document.Save("input.pdf");

      var options = TableOptions.Create()
          .InsertPageBefore(1)
          .AddTable()
              .AddRow()
                  .AddCell()
                      .AddParagraph(new TextFragment("Header 1"))
                  .AddCell()
                      .AddParagraph(new TextFragment("Header 2"))
              .AddRow()
                  .AddCell()
                      .AddParagraph(new TextFragment("Cell 1"))
                  .AddCell()
                      .AddParagraph(new TextFragment("Cell 2"));
      options.AddInput(new FileDataSource("input.pdf"));
      options.AddOutput(new FileDataSource("output.pdf"));
      var result = new TableGenerator().Process(options);
      Console.WriteLine(result.ResultCollection.Count > 0 ? "Table added" : "No output");

  Security:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Pdf.LowCode; (for Security, EncryptionOptions, FileDataSource)"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.Facades; (for DocumentPrivilege)"
      - "REQUIRED: new EncryptionOptions(ownerPassword, userPassword, DocumentPrivilege) — 3-arg constructor confirmed working (harness Sprint 22)"
      - "REQUIRED: new Security().Process(encOptions) — use the LowCode Security plugin"
      - "REQUIRED: encOptions.AddInput(new FileDataSource( — PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: encOptions.AddOutput(new FileDataSource( — encrypted PDF output via AddOutput(new FileDataSource(path))"
      - "REQUIRED: DocumentPrivilege privilege = DocumentPrivilege.ForbidAll — use DocumentPrivilege to set allowed operations"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use EncryptionOptions instead"
      - "FORBIDDEN: PdfFileSecurity — this is core Aspose.Pdf.Facades API; use LowCode Security instead"
      - "FORBIDDEN: Document.Encrypt() — this is core API; use LowCode Security.Process() instead"
  FormFlattener:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Pdf.LowCode; (for FormFlattener, FormFlattenAllFieldsOptions, FileDataSource)"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.Forms; (for TextBoxField)"
      - "REQUIRED: new FormFlattenAllFieldsOptions() — no-param constructor, confirmed working (harness Sprint 22)"
      - "REQUIRED: new FormFlattener().Process(flattenOptions) — use the LowCode FormFlattener plugin"
      - "REQUIRED: flattenOptions.AddInput(new FileDataSource( — AcroForm PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: flattenOptions.AddOutput(new FileDataSource( — flattened PDF output via AddOutput(new FileDataSource(path))"
      - "REQUIRED: var textBox = new TextBoxField(page, new Aspose.Pdf.Rectangle( — create AcroForm fixture with at least one TextBoxField"
      - "REQUIRED: doc.Form.Add(textBox, 1) — add the TextBoxField to the document's form on page 1"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use FormFlattenAllFieldsOptions instead"
      - "FORBIDDEN: Document.Form.Flatten() — this is core API; use LowCode FormFlattener.Process() instead"
      - "FORBIDDEN: PdfFileEditor for form operations — use LowCode FormFlattener instead"
  FormEditor:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Pdf.LowCode; (for FormEditor, FormRemoveAllFieldsOptions, FileDataSource)"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.Forms; (for TextBoxField)"
      - "REQUIRED: new FormRemoveAllFieldsOptions() — no-param constructor; use FormRemoveAllFieldsOptions NOT FormEditorRemoveOptions (which is abstract)"
      - "REQUIRED: new FormEditor().Process(removeOptions) — use the LowCode FormEditor plugin"
      - "REQUIRED: removeOptions.AddInput(new FileDataSource( — AcroForm PDF input added via AddInput(new FileDataSource(path))"
      - "REQUIRED: removeOptions.AddOutput(new FileDataSource( — modified PDF output via AddOutput(new FileDataSource(path))"
      - "REQUIRED: var textBox = new TextBoxField(page, new Aspose.Pdf.Rectangle( — create AcroForm fixture with at least one TextBoxField"
      - "REQUIRED: doc.Form.Add(textBox, 1) — add the TextBoxField to the document's form on page 1"
    forbidden:
      - "FORBIDDEN: new PluginOptions() — PluginOptions is abstract; use FormRemoveAllFieldsOptions instead"
      - "FORBIDDEN: new FormEditorRemoveOptions() — FormEditorRemoveOptions is abstract base class; use FormRemoveAllFieldsOptions instead"
      - "FORBIDDEN: Document.Form.Remove() — this is core API; use LowCode FormEditor.Process() instead"
  FormExporter:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Pdf.LowCode; (for FormExporter, FormExporterToJsonOptions, FileDataSource)"
      - "REQUIRED: using Aspose.Pdf; (for Document fixture creation)"
      - "REQUIRED: using Aspose.Pdf.Forms; (for TextBoxField)"
      - "REQUIRED: new FormExporterToJsonOptions() — no-param constructor; exports form field data to JSON"
      - "REQUIRED: new FormExporter().Process(exportOptions) — use the LowCode FormExporter plugin"
      - "REQUIRED: exportOptions.AddInput(new FileDataSource( — AcroForm PDF input added via AddInput(new FileDataSource(path))"
