family: tex
display_name: Aspose.TeX for .NET
enabled: true
status: discovery_only
# LOWCODE_EQUIVALENT: products.aspose.net/tex/ shows plugin-style API structurally
# identical to LowCode families. DLL uses Aspose.TeX.Plugin namespace (not Aspose.TeX.LowCode).
# classification_override forces LowCode treatment until the product DLL migrates to
# the standard Aspose.TeX.LowCode namespace. expected_namespace triggers automatic
# detection when that migration happens.

nuget:
  package_id: Aspose.TeX
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.TeX.LowCode
    - Aspose.TeX.LowCode.*
    - Aspose.TeX.Plugin
    - Aspose.TeX.Plugin.*
    - Aspose.TeX.Plugins
    - Aspose.TeX.Plugins.*
  fallback_strategy: capability_registry
  classification_override: LOWCODE
  expected_namespace: Aspose.TeX.LowCode

github:
  official_examples_repo:
    owner: aspose-tex
    repo: Aspose.TeX-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-tex-net
    repo: Aspose.TeX.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
