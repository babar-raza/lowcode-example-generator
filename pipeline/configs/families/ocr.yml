family: ocr
display_name: Aspose.OCR for .NET
enabled: true
status: discovery_only
# REFLECTION_BLOCKED (2026-05-09): Aspose.Drawing.Common assembly needed by OCR DLL.
#   Fix: NuGet package is "Aspose.Drawing" (not "Aspose.Drawing.Common" which is Microsoft's).
# BLOCKER_RESOLVED (2026-06-15): Aspose.AI.LLM assembly maps to NuGet package "Aspose.LLM"
#   (versions 26.2.0-26.5.0 confirmed on api.nuget.org/v3-flatcontainer/aspose.llm/index.json).
#   Previous blocker checked for "aspose.ai.llm" (assembly name) instead of "aspose.llm" (NuGet ID).
#   Added Aspose.LLM to extra_packages below.
# Do NOT mark as CONFIRMED_NO_LOWCODE — reflection needs re-run to confirm.

nuget:
  package_id: Aspose.OCR
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 3
    extra_packages:
      - Aspose.Drawing
      - Aspose.LLM

plugin_detection:
  namespace_patterns:
    - Aspose.OCR.LowCode
    - Aspose.OCR.LowCode.*
  fallback_strategy: capability_registry

github:
  official_examples_repo:
    owner: aspose-ocr
    repo: Aspose.OCR-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-ocr-net
    repo: Aspose.OCR.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
