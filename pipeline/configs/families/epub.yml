family: epub
display_name: Aspose.Epub for .NET
enabled: false
status: discovery_blocked
# RECLASSIFIED Sprint 34 (2026-05-18): Aspose.Epub package_id does NOT exist on NuGet.org (HTTP 404).
# There is no standalone Aspose EPUB product with a NuGet distribution.
# EPUB is handled by Aspose.Words as a conversion output format (words family, already covered).
# Verdict: CONFIRMED_NO_STANDALONE_NUGET_PACKAGE
# Action: Disabled. No further discovery runs until Aspose releases a dedicated EPUB NuGet package.

nuget:
  package_id: Aspose.Epub
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Epub.LowCode
    - Aspose.Epub.LowCode.*

github:
  official_examples_repo:
    owner: aspose-epub
    repo: Aspose.Epub-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-epub-net
    repo: Aspose.Epub.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
