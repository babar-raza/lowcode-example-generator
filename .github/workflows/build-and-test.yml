name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pip-audit

      - name: Lint with ruff
        # Blocking gate: ruff exits 0 after TC-H09 fixes (F811, F402 fixed; E741 added to ignore).
        run: ruff check src/ tests/

      - name: Security audit (pip-audit)
        # Advisory gate: block on HIGH severity CVEs; LOW/MED are informational.
        # pip itself has advisories (PYSEC-2024-48) that are excluded since it is
        # the installer, not a runtime dependency.
        run: pip-audit --ignore-vuln PYSEC-2024-48 --severity high
        continue-on-error: true

      - name: Install bandit (SAST)
        run: pip install bandit[toml]

      - name: SAST scan (bandit)
        # Non-blocking: produces artifact for evidence; will be gated after baseline established.
        # Uses pyproject.toml [tool.bandit] skips for parity with GitLab CI bandit-sast job.
        run: |
          bandit -c pyproject.toml -r src/ --format json -o bandit-report.json || true
          echo "=== Bandit high findings ===" && python -c "
          import json, sys
          try:
              data = json.load(open('bandit-report.json'))
              highs = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
              print(f'HIGH severity findings: {len(highs)}')
              for h in highs[:5]: print(f'  {h.get(\"filename\")}:{h.get(\"line_number\")}: {h.get(\"test_id\")} {h.get(\"issue_text\",\"\")[:80]}')
          except Exception as e: print(f'Could not parse bandit-report.json: {e}')
          " || true

      - name: Upload bandit SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sast-report-${{ matrix.python-version }}
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Run unit tests with coverage
        run: |
          PYTHONPATH=src python -m pytest tests/unit -v --timeout=60 \
            --cov=src/plugin_examples --cov-report=term-missing --cov-fail-under=70

      - name: Run integration tests
        run: |
          PYTHONPATH=src python -m pytest tests/integration -v --timeout=120

      - name: "RISK-10: Gate isolation — no AI imports in gate modules"
        run: |
          # Fail CI if the primary gate evaluation module imports LLM/AI modules.
          # Scope: example_gates.py only — matches unit test scope in test_risk_mitigations.py:TestGateIsolation.
          # publication_gate.py probe import (try/except ImportError) is intentionally excluded.
          if grep -rn "from plugin_examples\.llm_router\|import plugin_examples\.llm_router\|from plugin_examples\.healing_intelligence\|import plugin_examples\.healing_intelligence\|from plugin_examples\.generator\|import plugin_examples\.generator" src/plugin_examples/gates/example_gates.py; then
            echo "::error::RISK-10 VIOLATION: Gate modules must not import AI/LLM modules"
            exit 1
          fi
          echo "Gate isolation check passed — no AI imports found in example_gates.py"

      - name: Compile check
        run: python -m compileall src

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lowcode-example-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build DllReflector
        run: dotnet build tools/DllReflector/DllReflector.csproj -c Release
