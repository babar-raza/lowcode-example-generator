family: zip
display_name: Aspose.ZIP for .NET
enabled: true
status: discovery_only
# NON_LOWCODE_FALLBACK: No LowCode namespace found (confirmed by DllReflector 2026-06-04).
# Archive.Save probe CONFIRMED 2026-06-04 — see prototypes/zip/output-validation.json.
# fallback_strategy=capability_registry enables probe-based example generation pipeline.
# See pipeline/plugin-capability-registry/zip.yaml for current probe status.

nuget:
  package_id: Aspose.ZIP
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  fallback_strategy: capability_registry
  namespace_patterns:
    - Aspose.ZIP.LowCode
    - Aspose.ZIP.LowCode.*

github:
  official_examples_repo:
    owner: aspose-zip
    repo: Aspose.ZIP-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-zip-net
    repo: Aspose.ZIP.Plugins-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
