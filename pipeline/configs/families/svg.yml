family: svg
display_name: Aspose.SVG for .NET
enabled: false
status: disabled
# NO_LOWCODE_CONFIRMED (Sprint 89): Binary string scan of Aspose.SVG.dll 26.4.0
# found ZERO LowCode namespace references (UTF-8/UTF-16). DllReflector failure was
# masking absence, not blocking discovery. Evidence: reports/sprint89/next-family/svg-reflection-result.json

nuget:
  package_id: Aspose.SVG
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: false
    max_depth: 3

plugin_detection:
  namespace_patterns:
    - Aspose.SVG.LowCode
    - Aspose.SVG.LowCode.*

github:
  official_examples_repo:
    owner: aspose-svg
    repo: Aspose.SVG-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-svg-net
    repo: Aspose.SVG.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
