family: finance
display_name: Aspose.Finance for .NET
enabled: true
status: non_lowcode_plugin
# Enabled as non_lowcode_plugin (sprint lowcode-all-family-recon-healing-20260623-01).
# No LowCode namespace; uses capability_registry fallback path (LOAD_SAVE_OPTIONS model).
# Wave10 dryrun examples proven 2026-06-05: convert-xbrl (+ parse-xbrl already CANONICAL).
# PR publication BLOCKED_EXTERNAL: target repo does not exist (escalate to babar-raza).
# NOTE: package_id below uses standard Aspose naming convention.
# Verify exact NuGet package ID at nuget.org before enabling generation.
# Discovery run will fail gracefully if package does not exist.

nuget:
  package_id: Aspose.Finance
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Finance.LowCode
    - Aspose.Finance.LowCode.*
  fallback_strategy: capability_registry

github:
  official_examples_repo:
    owner: aspose-finance
    repo: Aspose.Finance-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-finance-net
    repo: Aspose.Finance.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
