repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        # Scoped to src/ and tests/ to match CI workflow scope.
        # scripts/ and reports/ contain legacy generated files not subject to lint enforcement.
        files: ^(src|tests)/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # Exclude legacy sprint archive files that contain pre-existing YAML syntax issues.
        exclude: ^workspace/verification/sprint32/
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: compileall
        name: Python compile check
        entry: python -m compileall src/
        language: system
        pass_filenames: false
        types: [python]
