# GitLab CI — Windows-host validation gate
#
# Runner: id=154 (local-docker-lowcode), shell executor (Git Bash), concurrent=1
# Platform role: GitLab CI validates on Windows. GitHub Actions is the primary CI
# (full matrix testing, SAST, schedules, Docker builds).
#
# Jobs: 5 blocking, 0 advisory, 0 schedule. Pipeline is binary: green or red.

stages:
  - lint
  - test
  - build

default:
  tags:
    - shell

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  GIT_DEPTH: "1"
  GIT_CLEAN_FLAGS: "-ffdx --exclude=.pip-cache"
  GIT_FETCH_EXTRA_FLAGS: "--filter=blob:none"
  GET_SOURCES_ATTEMPTS: "3"

.on-code-change:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Lint ─────────────────────────────────────────────────────
# Consolidates ruff, compile, mypy, detect-secrets, license-check, and gate-isolation
# into one job. With concurrent=1, separate jobs were already sequential — this saves
# 6 redundant venv creations (~3 min overhead).

lint:
  stage: lint
  extends: .on-code-change
  cache:
    key: pip-lint
    paths:
      - .pip-cache/
  before_script:
    - python -m venv --clear .pip-cache/lint-venv
    - source .pip-cache/lint-venv/Scripts/activate
    - pip install "ruff>=0.15" mypy detect-secrets pip-licenses -e .
  script:
    - ruff check src/ tests/
    - python -m compileall src/
    - mypy src/plugin_examples/ --ignore-missing-imports
    - detect-secrets scan --baseline .secrets.baseline
    - detect-secrets audit --report .secrets.baseline
    - pip-licenses --ignore-packages plugin-examples --allow-only="MIT License;MIT;BSD License;BSD;BSD-2-Clause;BSD-3-Clause;Apache Software License;Apache-2.0;ISC License;ISC;Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);Public Domain;The Unlicense (Unlicense);UNKNOWN"
    - |
      if grep -rn \
        "from plugin_examples\.llm_router\|import plugin_examples\.llm_router\|from plugin_examples\.healing_intelligence\|import plugin_examples\.healing_intelligence\|from plugin_examples\.generator\|import plugin_examples\.generator" \
        src/plugin_examples/gates/example_gates.py; then
        echo "RISK-10 VIOLATION: Gate modules must not import AI/LLM modules"
        exit 1
      fi
      echo "Gate isolation check passed"

# ── Tests ────────────────────────────────────────────────────
# Single Python version (py313). GHA tests py312+py313 on Linux.
# GitLab's unique value is Windows-host validation.

.test-base:
  stage: test
  extends: .on-code-change
  variables:
    PYTHONPATH: src
  cache:
    key: pip-test
    paths:
      - .pip-cache/
  before_script:
    - python -m venv --clear .pip-cache/test-venv
    - source .pip-cache/test-venv/Scripts/activate
    - pip install -e ".[dev]"
  artifacts:
    when: always
    reports:
      junit: report-*.xml
    expire_in: 7 days

unit-tests:
  extends: .test-base
  variables:
    PYTHONPATH: src
    COVERAGE_BASELINE: "79"
  script:
    - >
      python -m pytest tests/unit -v --timeout=60
      --junitxml=report-unit.xml
      --cov=src/plugin_examples --cov-report=term-missing
      --cov-report=html:coverage-html --cov-report=xml:coverage.xml
      --cov-fail-under=70
      | tee pytest-output.txt
    - |
      COV_PCT=$(grep "^TOTAL" pytest-output.txt | awk '{print int($NF)}' || echo "0")
      if [ "$COV_PCT" -gt 0 ] && [ "$COV_PCT" -lt "$((COVERAGE_BASELINE - 2))" ]; then
        echo "COVERAGE RATCHET FAIL: ${COV_PCT}% < baseline ${COVERAGE_BASELINE}% - 2%"
        exit 1
      fi
      echo "Coverage ratchet OK: ${COV_PCT}% (baseline: ${COVERAGE_BASELINE}%)"
  artifacts:
    when: always
    paths:
      - coverage-html/
      - coverage.xml
    reports:
      junit: report-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days

integration-tests:
  extends: .test-base
  script:
    - >
      python -m pytest tests/integration -v --timeout=120
      --junitxml=report-integration.xml

compliance-gate:
  extends: .test-base
  script:
    - python -m plugin_examples doctor --json > doctor-report.json
    - |
      python -c "
      import sys, json
      d = json.load(open('doctor-report.json'))
      f = d['summary']['failed']
      t = d['summary']['total']
      print('Doctor: ' + str(t) + ' checks, ' + str(f) + ' failed')
      sys.exit(1 if f > 0 else 0)
      "
  artifacts:
    when: always
    paths:
      - doctor-report.json
    expire_in: 7 days

# ── Build ────────────────────────────────────────────────────

dotnet-build:
  stage: build
  extends: .on-code-change
  script:
    - dotnet build tools/DllReflector/DllReflector.csproj -c Release
