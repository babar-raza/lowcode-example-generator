[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-examples"
version = "0.31.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "Jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "pre-commit>=3.7",
    "mutmut>=2.4",
    "hypothesis>=6.0",
]

[project.scripts]
plugin-examples = "plugin_examples.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM"]
ignore = [
    "E501",  # line too long — existing code exceeds 120 chars in many places
    "E701",  # multiple statements on one line (colon) — intentional in binary parsing
    "E702",  # multiple statements on one line (semicolon) — intentional in binary parsing
    "E402",  # module import not at top — intentional deferred imports
    "E731",  # lambda assignment — cosmetic, 1 instance
    "F401",  # unused import — many are re-exports from __init__.py
    "F541",  # f-string without placeholders — intentional template patterns
    "F841",  # unused variable — some intentional (struct offset parsing)
    "E741",  # ambiguous variable name — `l` used pervasively as loop var abbreviation for "line"
]

[tool.coverage.run]
source = ["plugin_examples"]
omit = ["*/tests/*", "*/_wave*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "legacy: tests exercising deprecated/orphaned code paths (not production coverage)",
]

[tool.bandit]
# SAST scanning configuration (EHV-04 — engineering hygiene gate)
# B101: assert_used — asserts used in test fixtures and validation guards
# B404: import_subprocess — subprocess used for dotnet/git system calls, not user input
# B603: subprocess_without_shell_equals_true — all calls use explicit arg lists
# B607: start_process_with_partial_path — used with known system tools (dotnet, git)
# B105: hardcoded_password_string — false positives on dict keys like "pass_verdict"
# B107: hardcoded_password_default — false positives on test fixture defaults
# B108: hardcoded_tmp_directory — /tmp used for ephemeral build artifacts
# B310: urllib_urlopen — urlopen used in fetcher with controlled URLs, not user input
# B314: blacklist xml.etree — xml.etree used for NuGet/csproj parsing, no untrusted input
# B405: import_xml_etree — same as B314
# B608: hardcoded_sql_expressions — false positives on string formatting (no SQL usage)
# B701: jinja2_autoescape_false — Jinja2 renders C# code templates, not HTML
skips = ["B101", "B404", "B603", "B607", "B105", "B107", "B108", "B310", "B314", "B405", "B608", "B701"]
targets = ["src"]

[tool.mutmut]
paths_to_mutate = "src/plugin_examples/gates/,src/plugin_examples/policy/loader.py,src/plugin_examples/reliability/slo_monitor.py,src/plugin_examples/compliance/reporter.py,src/plugin_examples/reliability/slo_remediator.py,src/plugin_examples/contracts/stage_contracts.py"
backup = false
runner = "python -m pytest tests/unit/ -x -q --timeout=30"
tests_dir = "tests/unit/"
dict_synonyms = "Struct, NamedStruct"
