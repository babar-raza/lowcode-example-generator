family: words
display_name: Aspose.Words for .NET
enabled: true
status: active

nuget:
  package_id: Aspose.Words
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
    - net48
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Words.LowCode
    - Aspose.Words.LowCode.*

github:
  official_examples_repo:
    owner: aspose-words
    repo: Aspose.Words-for-.NET
    branch: master

  published_plugin_examples_repo:
    owner: aspose-words-net
    repo: Aspose.Words.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources:
    - type: github
      owner: aspose-words
      repo: Aspose.Words-for-.NET
      branch: master
      paths:
        - Examples/Data

existing_examples:
  sources:
    - type: github
      owner: aspose-words
      repo: Aspose.Words-for-.NET
      branch: master
      paths:
        - Examples/DocsExamples

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 10
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types:
    - Converter
    - Watermarker
    - Splitter
    - Replacer
    - Merger
    - Comparer
    - MailMerger
    # Processor: REMOVED from pilot — Processor.From() is instance method but no public constructor exists.
    # CS0120 error confirmed. ProcessorContext investigation required before re-enabling.
    # See taskcard: followup-words-processor-api-investigation
  preferred_methods_per_type:
    Watermarker: SetText
    Splitter: ExtractPages
    Replacer: Replace
    Converter: Convert
    Merger: Merge
    Comparer: Compare
    MailMerger: Execute

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: true
  require_example_reviewer: true
  runtime_runner: auto

llm:
  provider_order:
    - llm_professionalize
    - ollama

template_hints:
  default_input_extension: ".docx"
  default_input_filename: "input.docx"
  array_input_filenames: ["input1.docx", "input2.docx"]
  input_creation_lines:
    - 'var doc = new Document();'
    - 'var builder = new DocumentBuilder(doc);'
    - 'builder.Writeln("Hello World");'
    - 'doc.Save("input.docx");'
  merger_input_creation_lines:
    - 'var doc1 = new Document();'
    - 'new DocumentBuilder(doc1).Writeln("Document 1");'
    - 'doc1.Save("input1.docx");'
    - 'var doc2 = new Document();'
    - 'new DocumentBuilder(doc2).Writeln("Document 2");'
    - 'doc2.Save("input2.docx");'
  comparer_input_creation_lines:
    - 'var doc1 = new Document();'
    - 'new DocumentBuilder(doc1).Writeln("Original content");'
    - 'doc1.Save("original.docx");'
    - 'var doc2 = new Document();'
    - 'new DocumentBuilder(doc2).Writeln("Modified content");'
    - 'doc2.Save("modified.docx");'
  additional_usings:
    - "Aspose.Words"
  default_output_extension: ".docx"
  default_fixture_extension: ".docx"
  mail_merger_template_creation_lines:
    - 'var templateDoc = new Document();'
    - 'var templateBuilder = new DocumentBuilder(templateDoc);'
    - 'templateBuilder.InsertField("MERGEFIELD FirstName");'
    - 'templateBuilder.Write(" ");'
    - 'templateBuilder.InsertField("MERGEFIELD LastName");'
    - 'templateDoc.Save("template.docx");'
  processor_input_creation_lines:
    - 'var doc = new Document();'
    - 'var builder = new DocumentBuilder(doc);'
    - 'builder.Writeln("Hello World");'
    - 'doc.Save("input.docx");'

per_type_constraints:
  Converter:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: Converter.Convert(inputFile, outputFile) — NOT Document.Save()"
    forbidden:
      - "FORBIDDEN: Document.Save() as the primary operation — always use LowCode Converter.Convert()"
  Watermarker:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: Watermarker.SetText(inputFile, outputFile, watermarkText)"
    forbidden:
      - "FORBIDDEN: manually adding watermark shapes to document.xml — use LowCode Watermarker.SetText()"
  Splitter:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: Splitter.ExtractPages(inputFile, outputFile, pageIndex)"
    forbidden:
      - "FORBIDDEN: Document.Save() replacing Splitter.ExtractPages() — use LowCode Splitter"
  Replacer:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: Replacer.Replace(inputFile, outputFile, pattern, replacement)"
    forbidden:
      - "FORBIDDEN: manual find/replace loops replacing Replacer.Replace() — use LowCode Replacer"
  Merger:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: using Aspose.Words;"
      - "REQUIRED: Merger.Merge(outputFile, inputFiles) — static call, NOT new Merger().Merge()"
      - "REQUIRED: 2 input DOCX files created programmatically via Document+DocumentBuilder"
    forbidden:
      - "FORBIDDEN: Document.AppendDocument() replacing Merger.Merge() — use LowCode Merger"
      - "FORBIDDEN: new Merger().Merge() — Merger.Merge() is static, call directly"
  Comparer:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: using Aspose.Words;"
      - "REQUIRED: Comparer.Compare(v1, v2, outputFile, author, DateTime.UtcNow) — static call"
      - "REQUIRED: 2 input DOCX files with DIFFERENT content for comparison to produce meaningful output"
    forbidden:
      - "FORBIDDEN: Document.Compare() replacing Comparer.Compare() — use LowCode Comparer"
      - "FORBIDDEN: new Comparer().Compare() — Comparer.Compare() is static, call directly"
  Processor:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: using Aspose.Words;"
      - "REQUIRED: Processor.From(inputFile).To(outputFile, SaveFormat.Pdf).Execute() — static-entry fluent chain"
      - "REQUIRED: SaveFormat enum from Aspose.Words namespace"
      - "REQUIRED: input DOCX created programmatically via Document+DocumentBuilder before calling Processor"
    forbidden:
      - "FORBIDDEN: Document.Save() replacing Processor chain — use LowCode Processor fluent API"
      - "FORBIDDEN: Processor.Convert() — does not exist; use Processor.From().To().Execute()"
      - "FORBIDDEN: new Processor() — Processor has no public constructor; entry point is static Processor.From(inputPath)"
  MailMerger:
    required:
      - "REQUIRED: using Aspose.Words.LowCode;"
      - "REQUIRED: using Aspose.Words;"
      - "REQUIRED: MailMerger.Execute(templateFile, outputFile, fieldNames, fieldValues) — static string-array overload"
      - "REQUIRED: string[] fieldNames = { \"FirstName\", \"LastName\" }; — array of merge field names"
      - "REQUIRED: string[] fieldValues = { \"John\", \"Doe\" }; — array of merge field values"
      - "REQUIRED: InsertField(\"MERGEFIELD — create MERGEFIELD fields in template via DocumentBuilder.InsertField"
    forbidden:
      - "FORBIDDEN: Document.MailMerge.Execute() — use LowCode MailMerger.Execute() static method"
      - "FORBIDDEN: IMailMergeDataSource — NOT needed; string array overload is sufficient"
      - "FORBIDDEN: MailMergeDataSource class — use string[] fieldNames + string[] fieldValues instead"
      - "FORBIDDEN: new MailMerger() — MailMerger.Execute() is static, call directly"
