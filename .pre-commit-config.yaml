repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        # Scoped to src/ and tests/ to match CI workflow scope.
        # scripts/ and reports/ contain legacy generated files not subject to lint enforcement.
        files: ^(src|tests)/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # Exclude legacy sprint archive files that contain pre-existing YAML syntax issues.
        exclude: ^workspace/verification/sprint32/
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src/"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: compileall
        name: Python compile check
        entry: python -m compileall src/
        language: system
        pass_filenames: false
        types: [python]
      - id: version-changelog-sync
        name: Version/CHANGELOG sync check
        entry: python -c "import sys; sys.path.insert(0,'src'); from plugin_examples.fixture_factory.engineering_hygiene_validators import check_version_changelog_sync; r=check_version_changelog_sync(); print(r.message); sys.exit(0 if r.passed else 1)"
        language: system
        pass_filenames: false
        files: (pyproject\.toml|CHANGELOG\.md)
