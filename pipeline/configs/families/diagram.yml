family: diagram
display_name: Aspose.Diagram for .NET
enabled: true
status: active
# Promoted discovery_only -> experimental on 2026-05-11 for controlled pilot.
# Promoted experimental -> active on 2026-05-11 after LLM generation 2/2 PASS.
# 2 WORKFLOW_ROOT types: DiagramConverter, PdfConverter.
# Fixture: programmatic VSDX via Aspose.Diagram.Diagram() (harness validated 4/4 PASS).

nuget:
  package_id: Aspose.Diagram
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Diagram.LowCode
    - Aspose.Diagram.LowCode.*

github:
  official_examples_repo:
    owner: aspose-diagram
    repo: Aspose.Diagram-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-diagram-net
    repo: Aspose.Diagram.LowCode-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 2
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types:
    - DiagramConverter
    - PdfConverter
  preferred_methods_per_type:
    DiagramConverter: Process
    PdfConverter: Process

template_hints:
  default_fixture_extension: .vsdx
  default_input_extension: .vsdx
  default_output_extension: .vdx

per_type_constraints:
  DiagramConverter:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Diagram.LowCode;"
      - "REQUIRED: DiagramConverter.Process("
      - "REQUIRED: DrawEllipse("
      - "REQUIRED: .Value = "
    forbidden:
      - "FORBIDDEN: IDiagramPlugin — use LowCode DiagramConverter, not the core plugin interface"
      - "FORBIDDEN: Manual Visio file manipulation replacing DiagramConverter.Process()"
      - "FORBIDDEN: PDF output with DiagramConverter — use PdfConverter for PDF output"
      - "FORBIDDEN: TypeValue"
      - "FORBIDDEN: new Shape()"
  PdfConverter:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Diagram.LowCode;"
      - "REQUIRED: PdfConverter.Process("
      - "REQUIRED: DrawEllipse("
      - "REQUIRED: .Value = "
    forbidden:
      - "FORBIDDEN: IDiagramPlugin — use LowCode PdfConverter, not the core plugin interface"
      - "FORBIDDEN: Manual diagram-to-PDF conversion replacing PdfConverter.Process()"
      - "FORBIDDEN: TypeValue"
      - "FORBIDDEN: new Shape()"

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
