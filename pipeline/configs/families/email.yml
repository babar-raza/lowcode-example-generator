family: email
display_name: Aspose.Email for .NET
enabled: true
status: active
# Promoted from discovery_only to active (2026-05-13, Sprint 6).
# Aspose.Email.LowCode confirmed: 3 types (Converter, FolderOutputHandler, IOutputHandler).
# Controlled pilot approved: allowed_types=[Converter] only.
# Target repo provisioned: aspose-email-net/Aspose.Email.LowCode-for-.NET-Examples (push=True).

nuget:
  package_id: Aspose.Email
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
    - net48
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.Email.LowCode
    - Aspose.Email.LowCode.*

github:
  official_examples_repo:
    owner: aspose-email
    repo: Aspose.Email-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-email-net
    repo: Aspose.Email.LowCode-for-.NET-Examples
    branch: main
  # Repo provisioned and push access confirmed (2026-05-13).

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types:
    - Converter

template_hints:
  default_input_extension: ".eml"
  default_input_filename: "input.eml"
  input_creation_lines:
    - '// RFC 2822 string fixture — create minimal valid .eml file'
    - 'var emlContent = "From: sender@test.com\r\nTo: recipient@test.com\r\nSubject: Test Email\r\nContent-Type: text/plain\r\n\r\nHello, this is a test email body.";'
    - 'System.IO.File.WriteAllText("input.eml", emlContent);'
  output_handler_creation_lines:
    - 'var outputDir = "output_dir";'
    - 'System.IO.Directory.CreateDirectory(outputDir);'
    - 'var outputHandler = new Aspose.Email.LowCode.FolderOutputHandler(outputDir);'
  additional_usings:
    - "Aspose.Email.LowCode"
    - "System.IO"
  default_output_extension: ".html"
  default_fixture_extension: ".eml"
  async_required: true
  async_note: "Converter.ConvertToHtml is async (returns Task). Main entry must be async Task Main(string[] args) and use await."

per_type_constraints:
  Converter:
    template_first: true
    required:
      - "REQUIRED: using Aspose.Email.LowCode;"
      - "REQUIRED: using System.IO; (for File.ReadAllBytes, MemoryStream, Directory.CreateDirectory)"
      - "REQUIRED: async Task Main(string[] args) — ConvertToHtml is async and MUST be awaited"
      - "REQUIRED: await Converter.ConvertToHtml(stream, fileName, outputHandler) — async call with await"
      - "REQUIRED: var stream = new MemoryStream(File.ReadAllBytes(\"input.eml\")); — wrap file bytes in MemoryStream"
      - "REQUIRED: var outputHandler = new FolderOutputHandler(outputDir); — IOutputHandler implementation for folder output"
      - "REQUIRED: Directory.CreateDirectory(outputDir); — create output directory before passing to FolderOutputHandler"
      - "REQUIRED: File.WriteAllText — create the input.eml fixture file before reading it with MemoryStream"
    forbidden:
      - "FORBIDDEN: MailMessage.Save() as the primary operation — use LowCode Converter.ConvertToHtml()"
      - "FORBIDDEN: Converter.ConvertToHtml(inputFilePath, outputFilePath) — output is NOT a file path; use IOutputHandler (FolderOutputHandler)"
      - "FORBIDDEN: new Converter() — Converter.ConvertToHtml() is static async, call directly with await"
      - "FORBIDDEN: synchronous void Main() when using async Converter — must be async Task Main()"
      - "FORBIDDEN: IOutputHandler custom implementation — use FolderOutputHandler(directory) which is the concrete impl"

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
