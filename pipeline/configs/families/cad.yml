family: cad
display_name: Aspose.CAD for .NET
enabled: true
status: discovery_only
# CONFIRMED_NO_LOWCODE: All-family discovery run 2026-05-09 found no LowCode namespace.
# Enabled for non-LowCode fallback generation (capability_registry).
# PROBE_CONFIRMED: convert-cad-to-pdf in pipeline/plugin-capability-registry/cad.yaml
# Re-enabled 2026-06-13 by all-family-recon-healing sprint.

nuget:
  package_id: Aspose.CAD
  version_policy: latest-stable
  pinned_version: null
  allow_prerelease: false
  target_framework_preference:
    - netstandard2.0
    - netstandard2.1
    - net8.0
    - net6.0
  dependency_resolution:
    enabled: true
    max_depth: 2

plugin_detection:
  namespace_patterns:
    - Aspose.CAD.LowCode
    - Aspose.CAD.LowCode.*
  fallback_strategy: capability_registry

github:
  official_examples_repo:
    owner: aspose-cad
    repo: Aspose.CAD-for-.NET
    branch: master
  published_plugin_examples_repo:
    owner: aspose-cad-net
    repo: Aspose.CAD.Plugins-for-.NET-Examples
    branch: main

fixtures:
  sources: []

existing_examples:
  sources: []

generation:
  min_examples_per_family: 3
  max_examples_per_monthly_run: 5
  allow_new_fixtures: true
  allow_generated_input_files: true
  allowed_types: []

validation:
  require_restore: true
  require_build: true
  require_run: true
  require_output_validation: false
  require_example_reviewer: false

llm:
  provider_order:
    - llm_professionalize
    - ollama
